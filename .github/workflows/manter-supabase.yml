# Mantém o Supabase (plano grátis) acordado: ele pausa após 7 dias sem uso.
# Roda todo dia (06:17 de Brasília) e grava um evento "ping" na tabela eventos.
# A chave usada é a pública (publishable), a mesma que já está no site.
name: Manter Supabase ativo
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no banco
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://fvxecqjiyjstyacqrumr.supabase.co/rest/v1/eventos" \
            -H "apikey: sb_publishable_le3V4al6wKdsfPZ4DXHKZg_cXtEP3DS" \
            -H "Content-Type: application/json" -H "Prefer: return=minimal" \
            -d '{"tipo":"ping","alvo":"github-actions"}')
          echo "HTTP $code"
          test "$code" = "201"
